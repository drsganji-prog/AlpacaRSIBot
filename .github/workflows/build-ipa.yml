# Builds an unsigned AlpacaRSIBot.ipa on GitHub's macOS runners.
# Download it from the run's "Artifacts" section, then sign & install it
# on your iPhone from Windows with Sideloadly (see README).
name: Build iPhone app (IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "catalysts.json"
      - "scan/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/daily-scan.yml"

# A newer commit cancels an older build that's still waiting or running.
concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project AlpacaRSIBot.xcodeproj \
            -target AlpacaRSIBot \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/AlpacaRSIBot.app Payload/
          zip -qry AlpacaRSIBot.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AlpacaRSIBot-ipa
          path: AlpacaRSIBot.ipa
